[project]
name = "man"
version = "0.1.0"
description = "..."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.142.2",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn[standard]>=0.54.0",
    "taskipy>=1.14.1",
]

[dependency-groups]
dev = ["pyright>=1.1.414", "ruff>=0.16.10"]

[tool.taskipy.tasks]
service = { cmd = "uvicorn man.app:app --reload --host 127.0.0.1 --port 8000", help = "run service" }
db_migrate = { cmd = "alembic upgrade head", help = "run alembic upgrade" }
lint = { cmd = "ruff format --check . && ruff check .", help = "run ruff linter" }
lint_fix = { cmd = "ruff format . && ruff check --fix .", help = "run ruff linter with autofix" }
type_check = { cmd = "pyright man", help = "run pyright type checker" }

[tool.ruff.lint]
ignore = ["B008"]
