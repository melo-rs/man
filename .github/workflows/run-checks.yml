name: Run Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Run Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: uv sync --dev --locked
      - run: uv run task lint
      - run: uv run task type_check

  test:
    name: Run Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      MAN_ENV: test
      MAN_POSTGRES_USER: man
      MAN_POSTGRES_PWD: man
      MAN_POSTGRES_HOST: 127.0.0.1
      MAN_POSTGRES_PORT: "5432"
      MAN_POSTGRES_DATABASE: man_test
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_USER: man
          POSTGRES_PASSWORD: man
          POSTGRES_DB: man_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U man -d man_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: uv sync --dev --locked
      - name: Apply and check migrations
        run: |
          uv run task db_migrate
          uv run alembic check
      - name: Run tests with coverage
        run: >-
          uv run python -m pytest
          --cov=man --cov-report=term-missing
          --cov-report=xml --cov-report=html
          --junitxml=test-results.xml
      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: |
            test-results.xml
            coverage.xml
            htmlcov/
          if-no-files-found: ignore
          retention-days: 14
