name: man-tests

services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: man
      POSTGRES_PASSWORD: man
      POSTGRES_DB: man_test
    ports:
      - "127.0.0.1:${MAN_TEST_POSTGRES_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U man -d man_test"]
      interval: 2s
      timeout: 5s
      retries: 20
